<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сайт на технической работе</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0a;
    color: #f5f5f5;
    position: relative;
  }

  /* Анимированный фон с плавающими частицами */
  .background {
    position: absolute;
    inset: 0;
    overflow: hidden;
    z-index: 1;
  }

  .background::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: 
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,0.06) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%);
    animation: rotate 30s linear infinite;
  }

  @keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Сетка */
  .grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    z-index: 1;
    animation: gridMove 20s linear infinite;
  }

  @keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 60px 60px; }
  }

  /* Контент */
  .content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 40px;
    max-width: 700px;
    animation: fadeIn 1.2s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Иконка шестерёнки */
  .icon-wrap {
    margin-bottom: 40px;
    display: inline-block;
  }

  .gear {
    width: 100px;
    height: 100px;
    stroke: #f5f5f5;
    stroke-width: 2;
    fill: none;
    animation: spin 6s linear infinite;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.4));
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Заголовок */
  h1 {
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 200;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 24px;
    color: #ffffff;
    text-shadow: 0 0 30px rgba(255,255,255,0.3);
  }

  /* Разделительная линия */
  .divider {
    width: 80px;
    height: 1px;
    background: #f5f5f5;
    margin: 0 auto 24px;
    position: relative;
  }

  .divider::before,
  .divider::after {
    content: '';
    position: absolute;
    top: -2px;
    width: 5px;
    height: 5px;
    background: #fff;
    border-radius: 50%;
  }

  .divider::before { left: -10px; }
  .divider::after { right: -10px; }

  /* Подзаголовок */
  p {
    font-size: clamp(14px, 2vw, 18px);
    font-weight: 300;
    letter-spacing: 3px;
    color: #a0a0a0;
    text-transform: uppercase;
    line-height: 1.8;
  }

  /* Пульсирующие точки */
  .dots {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .dot {
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }

  .dot:nth-child(1) { animation-delay: 0s; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  /* Декоративные рамки по краям */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.3);
    z-index: 5;
  }

  .corner.tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
  .corner.tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
  .corner.br { bottom: 30px; right: 30px; border-left: none; border-top: none; }
</style>
</head>
<body>

  <div class="background"></div>
  <div class="grid"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="content">
    <div class="icon-wrap">
      <svg class="gear" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="20"/>
        <path d="M50 5 L50 25 M50 75 L50 95 M95 50 L75 50 M25 50 L5 50 
                 M81.8 18.2 L67.7 32.3 M32.3 67.7 L18.2 81.8 
                 M81.8 81.8 L67.7 67.7 M32.3 32.3 L18.2 18.2"/>
        <circle cx="50" cy="50" r="35" stroke-dasharray="8 6"/>
      </svg>
    </div>

    <h1>Техническая работа</h1>
    <div class="divider"></div>
    <p>Мы скоро вернёмся<br>Приносим извинения за неудобства</p>

    <div class="dots">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

</body>
</html>
